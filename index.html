<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TITAN-X AI</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>

<body>

<!-- MATRIX BACKGROUND -->
<canvas id="matrix"></canvas>

<!-- MAIN DASHBOARD -->
<div class="dashboard">

    <!-- TOP BAR -->
    <header class="topbar">

        <div class="logo">
            TITAN-X
        </div>

        <div class="status">
            🟢 SYSTEM ONLINE
        </div>

    </header>

    <!-- AI CORE -->
    <section class="core-section">

        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="ring ring3"></div>

        <div class="core">
            AI
        </div>

    </section>

    <!-- INSERTED: LIVE CLOCK, AI STATUS, VOICE WAVE, RADAR -->

    <!-- LIVE CLOCK -->
    <div id="clock" class="live-clock">
        00:00:00
    </div>

    <!-- AI STATUS -->
    <div class="ai-status">
        <span class="dot"></span>
        <span id="statusText">AI ONLINE</span>
    </div>

    <!-- VOICE WAVE -->
    <div class="voice-wave">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- RADAR -->
    <div class="radar">
        <div class="radar-circle"></div>
        <div class="radar-line"></div>
    </div>

    <!-- INFO PANELS -->

    <div class="panels">

        <div class="panel">
            <h2>CPU</h2>
            <p>Loading...</p>
        </div>

        <div class="panel">
            <h2>RAM</h2>
            <p>Loading...</p>
        </div>

        <div class="panel">
            <h2>NETWORK</h2>
            <p>ONLINE</p>
        </div>

        <div class="panel">
            <h2>MISSION</h2>
            <p>TITAN-X</p>
        </div>

    </div>

    <!-- TERMINAL -->

    <div class="terminal">

        <p>>&nbsp; Booting TITAN-X...</p>

    </div>

</div>

<!-- LEFT SYSTEM PANEL -->
<div class="left-panel">
  <div class="card">CPU</div>
  <div class="card">RAM</div>
  <div class="card">GPU</div>
  <div class="card">Battery</div>
</div>

<!-- RIGHT INFO PANEL -->
<div class="right-panel">
  <div class="card">Time</div>
  <div class="card">Date</div>
  <div class="card">Weather</div>
  <div class="card">Location</div>
</div>

<!-- AI VOICE PANEL -->
<div class="voice-panel">
  <div class="mic"></div>
  <h2>Listening...</h2>
</div>

<!-- BOOT SCREEN -->
<div id="boot-screen">
  <h1>TITAN-X</h1>
  <p>Initializing AI Core...</p>
</div>

<!-- SCAN LINE -->
<div class="scanline"></div>

<!-- PARTICLES -->
<div id="particles"></div>

<!-- FOOTER -->
<footer>
  TITAN-X v0.1 Alpha | AI ONLINE
</footer>

<script src="script.js"></script>

</body>
</html>
